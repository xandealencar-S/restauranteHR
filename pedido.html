<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido - Restaurante HR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Restaurante HR</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="cardapio.html">Cardápio</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
            <a href="pedido.html">Pedido</a>
        </nav>
    </header>
    <div class="inicio">
        <h2>Faça seu Pedido</h2>
        <p>Preencha seus dados para fazer o pedido.</p>
    </div>
    <div class="texto">
        <h2 class="titulo1">Seus Dados</h2>
        <form>
            <p>
                <b>Nome:</b><br>
                <input type="text" name="nome" required>
            </p>
            <p>
                <b>Telefone:</b><br>
                <input type="tel" name="telefone" required>
            </p>
            <p>
                <b>CPF:</b><br>
                <input type="text" name="cpf" maxlength="11" placeholder="Somente números" required>
            </p>
            <p>
                <b>CEP:</b><br>
                <input type="text" name="cep" maxlength="8" placeholder="Somente números" required>
            </p>
            <p>
                <b>Rua:</b><br>
                <input type="text" name="rua" required>
            </p>
            <p>
                <b>Número da casa:</b><br>
                <input type="text" name="numero" required>
            </p>
            <p>
                <b>Complemento:</b><br>
                <input type="text" name="complemento">
            </p>
            <button class="botao" type="submit">Enviar pedido</button>
        </form>
    </div>
    <footer>
        <p>© 2026 Restaurante HR</p>
    </footer>
</body>
</html>
